      <!-- GA4 base - Load on user interaction or after delay for better performance -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ 
      try { 
        if (window.gtagLoadError) {
          console.warn('Google Analytics not available, skipping tracking');
          return;
        }
        dataLayer.push(arguments); 
      } catch(e){ 
        console.log('Analytics error:', e);
      }
    }

    // Enable "DebugView" only when ?debug=1 is present
    var DEBUG = location.search.includes('debug=1');
    var analyticsLoaded = false;

    function loadAnalytics() {
      if (analyticsLoaded) return;
      analyticsLoaded = true;

      // Load Google Analytics script with error handling
      const gaScript = document.createElement('script');
      gaScript.async = true;
      gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-R7SFT14JN7';
      
      gaScript.onerror = function() {
        console.warn('Google Analytics script failed to load');
        window.gtagLoadError = true;
      };
      
      gaScript.onload = function() {
        console.log('Google Analytics script loaded successfully');
        window.gtagLoadSuccess = true;
        
        // Initialize after script loads
        try {
          gtag('js', new Date());
          gtag('config', 'G-R7SFT14JN7', {
            send_page_view: true,
            cookie_domain: 'auto',
            cookie_flags: 'SameSite=None;Secure',
            debug_mode: DEBUG,
            enhanced_measurement: true,
            custom_map: {
              'custom_parameter_1': 'service_type',
              'custom_parameter_2': 'business_size'
            }
          });
          gtag('config', 'AW-17598200279');
        
        // Initialize SPA tracking after GA is ready
        if (window.initSPATracking) {
          window.initSPATracking();
        }
        } catch(e) {
          console.warn('Google Analytics initialization failed:', e);
        }
      };
      
      document.head.appendChild(gaScript);
    }

    // Load analytics on user interaction (scroll, click, touch, keypress) or after 3 seconds
    var interactionEvents = ['scroll', 'click', 'touchstart', 'keydown'];
    var hasInteracted = false;
    var loadTimeout = setTimeout(loadAnalytics, 3000); // Load after 3 seconds if no interaction

    interactionEvents.forEach(function(event) {
      window.addEventListener(event, function() {
        if (!hasInteracted) {
          hasInteracted = true;
          clearTimeout(loadTimeout);
          // Use requestIdleCallback if available, otherwise load immediately
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadAnalytics, { timeout: 2000 });
          } else {
            setTimeout(loadAnalytics, 100);
          }
        }
      }, { once: true, passive: true });
    });
  </script>

  <!-- SPA/Client-side routing support for GA4 -->
  <script>
  (function(){
    // Wait for gtag to be available
    function initSPATracking() {
      if (!window.gtag || window.gtagLoadError) {
        // Only retry if analytics is loaded
        if (window.gtagLoadSuccess || analyticsLoaded) {
          setTimeout(initSPATracking, 100);
        }
        return;
      }

      function sendPV(){
        try {
          gtag('event', 'page_view', {
            page_location: location.href,
            page_path: location.pathname + location.search + location.hash,
            page_title: document.title
          });
        } catch(e) {
          console.warn('Google Analytics page view tracking failed:', e);
        }
      }

      // Fire on history API changes (pushState/replaceState)
      ['pushState','replaceState'].forEach(function(m){
        var orig = history[m];
        history[m] = function(){
          var ret = orig.apply(this, arguments);
          // Use requestIdleCallback for non-blocking tracking
          if ('requestIdleCallback' in window) {
            requestIdleCallback(sendPV, { timeout: 1000 });
          } else {
            setTimeout(sendPV, 0);
          }
          return ret;
        };
      });

      // Fire on back/forward & hash changes (non-blocking)
      window.addEventListener('popstate', function() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(sendPV, { timeout: 1000 });
        } else {
          setTimeout(sendPV, 0);
        }
      }, { passive: true });
      
      window.addEventListener('hashchange', function() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(sendPV, { timeout: 1000 });
        } else {
          setTimeout(sendPV, 0);
        }
      }, { passive: true });
    }
    
      // Start initialization when analytics loads
      // This will be called after user interaction or timeout
      window.initSPATracking = initSPATracking;
      
      // Also try to initialize if analytics is already loaded
      if (window.gtagLoadSuccess) {
        initSPATracking();
      }
  })();
  </script>

    <!-- Service Worker Registration with Auto-Update - Optimized for bfcache -->
    <script>
      if ('serviceWorker' in navigator) {
        // Use pageshow instead of load to support bfcache
        window.addEventListener('pageshow', (event) => {
          // Only register/update on initial load, not on bfcache restore
          if (event.persisted) {
            // Page was restored from bfcache, skip service worker update
            return;
          }
          
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
              
              // Check for updates, but don't force reload immediately
              registration.addEventListener('updatefound', () => {
                console.log('New service worker found, updating...');
                const newWorker = registration.installing;
                
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New service worker is available
                    // Don't force reload immediately - let user continue browsing
                    // The new service worker will activate on next page load
                    console.log('New service worker installed. Will activate on next navigation.');
                  }
                });
              });
              
              // Check for updates in the background (non-blocking)
              if ('requestIdleCallback' in window) {
                requestIdleCallback(() => {
                  registration.update();
                }, { timeout: 5000 });
              } else {
                setTimeout(() => {
                  registration.update();
                }, 2000);
              }
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
